<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grill · вопросы и решения</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/">grill<span>Вопросы и решения</span></a><div id="roundTitle"></div><span id="progress"></span></header>
<div id="notice" role="status" aria-live="polite"></div>
<div class="workspace">
  <aside class="sidebar"><h2>В этом раунде</h2><nav id="questions" aria-label="Вопросы раунда"></nav><p class="sidebar-note">Можно отвечать в любом порядке. Каждый вопрос открывает своё обсуждение.</p><button id="submit" class="primary">Отправить раунд</button><p id="submitHint" class="muted"></p></aside>
  <main id="main"><div class="question-top"><span id="questionId" class="muted"></span><button id="discuss">Обсудить отдельно</button></div><h1 id="title"></h1><p id="body" class="prose"></p><div class="recommendation"><strong>Рекомендую</strong><p id="recommendation" class="prose"></p></div><fieldset id="options"><legend>Твой выбор</legend><div id="optionList"></div></fieldset><label class="answer-label" for="answer">Свой ответ или уточнение</label><textarea id="answer" rows="5" placeholder="Можно предложить другой вариант или добавить условия…"></textarea><div class="answer-actions"><span id="saved" class="muted" aria-live="polite"></span><button id="confirm" class="primary">Подтвердить ответ</button></div></main>
  <aside id="chatPanel" class="chat-panel" aria-label="Отдельное обсуждение" hidden><div class="chat-heading"><div><h2>Обсуждение вопроса</h2><p id="chatQuestion" class="muted"></p></div><button id="closeChat" aria-label="Скрыть обсуждение">×</button></div><p id="runtime" class="runtime"></p><div id="messages" role="log" aria-live="polite" tabindex="0" aria-label="История обсуждения"></div><div id="chatStatus" role="status"></div><div class="chat-tools"><button id="summarize">Собрать черновик ответа</button><button id="stop" hidden>Остановить</button></div><section id="summaryBox" hidden><label for="summary">Черновик из обсуждения</label><textarea id="summary" rows="4"></textarea><button id="useSummary">Вставить в мой ответ</button></section><form id="chatForm"><label for="message">Сообщение в отдельный чат</label><textarea id="message" rows="3" placeholder="Например: что потеряю, если выберу второй вариант?"></textarea><button id="send" class="primary" type="submit">Отправить сообщение</button></form><p class="privacy">В основной разговор вернётся только подтверждённый ответ.</p></aside>
</div>
</body></html>
